<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loyl</title>
    <meta
      name="description"
      content="Loyl is a soulbound event pass that levels up on-chain as you check in to sessions, give talks and meet people."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181d" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('ncrypt-theme')
        } catch (e) {}
        var dark = stored === 'dark' || ((!stored || stored === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
