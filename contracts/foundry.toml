[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./previews" },
]

[lint]
# reentrancy-events: the only external call is SignatureChecker's ERC-1271 staticcall, which cannot change state.
# block-timestamp: used only for signature deadlines capped at 1 hour, where a few seconds of drift is harmless.
exclude_lints = ["reentrancy-events", "block-timestamp"]

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 2048

[rpc_endpoints]
local = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
