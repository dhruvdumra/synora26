# Front door on the EC2 host. CloudFront is the only client, so this only has to be fast and boring.
# Lives at /opt/loyl/nginx.conf.

upstream indexer {
    server indexer:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Nginx, not the app, answers the load balancer health check.
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://indexer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Server-sent events: no buffering, no timeout, no chunk rewriting.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location / {
        return 404;
    }
}
