# Lives on the EC2 host at /opt/loyl/docker-compose.yml.
# `docker compose up -d` after each image pull; GitHub Actions does this over SSM.
services:
  indexer:
    image: ${INDEXER_IMAGE}
    container_name: loyl-indexer
    restart: unless-stopped
    env_file: /opt/loyl/indexer.env
    volumes:
      - indexer-data:/app/data
    # Only Nginx talks to the container; the port is not published to the internet.
    expose:
      - "3001"
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /loyl/indexer
        awslogs-create-group: "true"

  nginx:
    image: nginx:1.29-alpine
    container_name: loyl-nginx
    restart: unless-stopped
    depends_on:
      - indexer
    ports:
      - "80:80"
    volumes:
      - /opt/loyl/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /loyl/nginx
        awslogs-create-group: "true"

volumes:
  indexer-data:
