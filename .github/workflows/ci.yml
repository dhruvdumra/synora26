name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
        working-directory: contracts
      - name: Check formatting
        run: forge fmt --check
        working-directory: contracts
      - name: Build (fails on lint warnings)
        run: forge build --sizes --deny warnings
        working-directory: contracts
      - name: Test
        run: forge test -vv
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
      - name: Gas report
        run: forge test --gas-report > gas-report.txt
        working-directory: contracts
      - uses: actions/upload-artifact@v4
        with:
          name: gas-report
          path: contracts/gas-report.txt

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_CHAIN: sepolia
          VITE_BADGE_ADDRESS: ${{ vars.BADGE_ADDRESS || '0x0000000000000000000000000000000000000001' }}

  indexer:
    name: Indexer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
        working-directory: indexer
      - run: npm run typecheck
        working-directory: indexer
      - name: Build the container image
        run: docker build -t loyl-indexer:ci .
        working-directory: indexer
